name: Update to new release

# checkov:skip=CKV_GHA_7: Optional maintainer override to pin a specific upstream version (e.g. a maintenance build or rollback). Input is regex-validated before use.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. 4.2.2.26075). Leave blank to use the latest version in S3."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-to-new-release:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          # Dependabot does not update this ref; bump it manually when Scoop publishes a release.
          ref: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f # v0.6.0
          path: .scoop
          persist-credentials: false

      - name: Update manifest with Scoop checkver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPath = "bucket/senzingsdk.json"
          $originalContent = (Get-Content -Path $manifestPath -Raw) -replace "`r`n", "`n"
          $currentVersion = ($originalContent | ConvertFrom-Json).version

          # Give Scoop an empty download cache so the MSI it downloads to compute the hash
          # can be inspected afterwards.
          $env:SCOOP_CACHE = Join-Path $env:RUNNER_TEMP 'scoop-cache'
          New-Item -ItemType Directory -Path $env:SCOOP_CACHE -Force | Out-Null

          $checkverArgs = @{ App = 'senzingsdk'; Dir = 'bucket'; Update = $true; ThrowError = $true }

          $requestedVersion = $env:INPUT_VERSION
          if ($requestedVersion) {
              # Validate the input to prevent injection via the workflow_dispatch input.
              # Accept both the dot form (4.3.2.26162) and the hyphen-before-build form (4.3.2-26162).
              if ($requestedVersion -notmatch '^\d+\.\d+\.\d+[.-]\d+$') {
                  Write-Error "Invalid version format: '$requestedVersion'. Expected <major>.<minor>.<patch>.<build>, e.g. 4.3.2.26162 or 4.3.2-26162."
                  exit 1
              }
              # Normalize to the canonical dot form used in the manifest and S3 object key.
              $requestedVersion = $requestedVersion -replace '-', '.'
              # -Version skips the checkver lookup and runs autoupdate for this version.
              # -ForceUpdate re-downloads and re-hashes even when it matches the manifest's
              # version, so a re-uploaded MSI can be picked up.
              $checkverArgs.Version = $requestedVersion
              $checkverArgs.ForceUpdate = $true
          }

          # Scoop's checkver finds the latest version using the manifest's "checkver" block,
          # then the "autoupdate" block rewrites the version, URL, and hash (downloading the
          # MSI to compute it). Output is streamed to the log as it happens (so it survives a
          # thrown error) and also captured so failures can be detected below.
          & ./.scoop/bin/checkver.ps1 @checkverArgs *>&1 | Tee-Object -Variable checkverOutput
          $output = $checkverOutput | Out-String

          # Normalize to LF. Scoop writes CRLF, and the signed-commit step uploads the file's
          # raw bytes (bypassing git's clean filter), so without this every auto-update would
          # rewrite the whole file to CRLF.
          $content = (Get-Content -Path $manifestPath -Raw) -replace "`r`n", "`n"
          $newVersion = ($content | ConvertFrom-Json).version

          # Compare the whole manifest, not just the version, so a hash-only change (a requested
          # version that matches the manifest but whose MSI was re-uploaded) still produces a PR.
          if ($content -eq $originalContent) {
              if ($requestedVersion) {
                  Write-Host "Manifest already matches $requestedVersion; nothing to update."
              } else {
                  # checkver reports lookup failures by printing rather than throwing, so only treat
                  # an unchanged manifest as "up to date" when checkver confirmed the current version.
                  if ($output -notmatch "(?m)^senzingsdk:\s+$([regex]::Escape($currentVersion))\s*$") {
                      Write-Error "checkver did not report a version; see output above."
                      exit 1
                  }
                  Write-Host "senzingsdk is already at the latest version ($currentVersion)."
              }
              echo "UPDATED=false" >> $env:GITHUB_ENV
              exit 0
          }

          # NEW_VERSION is interpolated into the branch name, commit message, and PR body,
          # so ensure it holds only digits and dots.
          if ($newVersion -notmatch '^\d+(\.\d+){3}$') {
              Write-Error "Unexpected version format from checkver: '$newVersion'."
              exit 1
          }

          # Scoop runs autoupdate for any version that differs from the manifest, including a lower
          # one (e.g. if the latest MSI is removed from S3). Only allow that when a maintainer
          # explicitly requested the version.
          if (-not $requestedVersion -and [version]$newVersion -lt [version]$currentVersion) {
              Write-Error "checkver found $newVersion, which is lower than the current $currentVersion. Refusing to downgrade; pass the version input to do so deliberately."
              exit 1
          }

          # Validate that S3 actually returned an MSI, not an error body or redirect HTML, before
          # committing its hash. MSI files are OLE compound documents; the first 8 bytes are a
          # fixed magic value. The cache started empty, so it holds only what checkver downloaded.
          $downloads = @(Get-ChildItem -Path $env:SCOOP_CACHE -File)
          if ($downloads.Count -eq 0) {
              Write-Error "checkver updated the manifest but no download was found in $env:SCOOP_CACHE to validate."
              exit 1
          }
          foreach ($download in $downloads) {
              $magicBytes = Get-Content -Path $download.FullName -AsByteStream -TotalCount 8
              $magicHex = ($magicBytes | ForEach-Object { $_.ToString('X2') }) -join ''
              if ($magicHex -ne 'D0CF11E0A1B11AE1') {
                  Write-Error "Downloaded file $($download.Name) is not an MSI (magic bytes: $magicHex; expected D0CF11E0A1B11AE1). S3 may have returned a non-MSI body."
                  exit 1
              }
          }

          Set-Content -Path $manifestPath -Value $content -Encoding UTF8NoBOM -NoNewline

          echo "UPDATED=true" >> $env:GITHUB_ENV
          echo "CURRENT_VERSION=$currentVersion" >> $env:GITHUB_ENV
          echo "NEW_VERSION=$newVersion" >> $env:GITHUB_ENV
          echo "DOWNLOAD_URL=$(($content | ConvertFrom-Json).architecture.'64bit'.url)" >> $env:GITHUB_ENV

      - name: Create signed commit and pull request
        if: env.UPDATED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $repo = $env:GITHUB_REPOSITORY
          $branch = "update-senzingsdk-$env:NEW_VERSION"
          $manifestPath = "bucket/senzingsdk.json"

          # Base the branch on main's current head so re-runs start clean (one commit on top of main)
          $mainSha = gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha'
          # Native (gh) failures don't throw under ErrorActionPreference='Stop', so check explicitly
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mainSha)) {
              Write-Error "Failed to resolve the head SHA of main."
              exit 1
          }

          # Create or reset the remote branch to main's head.
          # PATCH fails if the branch doesn't exist yet, so fall back to creating it.
          gh api -X PATCH "repos/$repo/git/refs/heads/$branch" -f sha=$mainSha -F force=true 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
              gh api -X POST "repos/$repo/git/refs" -f ref="refs/heads/$branch" -f sha=$mainSha | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to create branch $branch."
                  exit 1
              }
          }

          # Commit the updated manifest via the GraphQL API so GitHub signs the commit
          # (shows as "Verified"); a local `git commit` would be unsigned.
          $contents = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $manifestPath).Path))
          $query = 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }'
          $body = @{
              query = $query
              variables = @{
                  input = @{
                      branch = @{
                          repositoryNameWithOwner = $repo
                          branchName = $branch
                      }
                      message = @{ headline = "Update senzingsdk to version $env:NEW_VERSION" }
                      # The branch head equals $mainSha after the create/reset above
                      expectedHeadOid = $mainSha
                      fileChanges = @{
                          additions = @(
                              @{ path = $manifestPath; contents = $contents }
                          )
                      }
                  }
              }
          } | ConvertTo-Json -Depth 10

          # Unique temp path avoids collisions if this ever runs on a shared (self-hosted) runner
          $bodyFile = [System.IO.Path]::GetTempFileName()
          Set-Content -Path $bodyFile -Value $body -Encoding UTF8
          # Capture the commit OID: gh exits non-zero on GraphQL errors, and a missing OID
          # catches any partial-success response that still returns exit 0.
          $commitOid = gh api graphql --input $bodyFile --jq '.data.createCommitOnBranch.commit.oid'
          $commitExit = $LASTEXITCODE
          Remove-Item $bodyFile -Force
          if ($commitExit -ne 0 -or [string]::IsNullOrWhiteSpace($commitOid)) {
              Write-Error "Failed to create signed commit on $branch via createCommitOnBranch."
              exit 1
          }
          Write-Host "Created signed commit $commitOid on $branch"

          # If a PR already exists for this branch, the commit above just updated it; skip creation
          $existingPr = gh pr list --head $branch --base main --state open --json url --jq '.[0].url'
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to query existing pull requests for $branch."
              exit 1
          }
          if ($existingPr) {
              Write-Host "PR already exists for $branch, updated by the new commit: $existingPr"
          } else {
              gh pr create `
                --base main `
                --head $branch `
                --title "Update senzingsdk to version $env:NEW_VERSION" `
                --body "Automated update from GitHub Actions workflow using Scoop's checkver/autoupdate.

          ## Changes
          - Updated version from $env:CURRENT_VERSION to $env:NEW_VERSION
          - Updated URL and SHA256 hash

          ## Source
          - $env:DOWNLOAD_URL"
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to create pull request for $branch."
                  exit 1
              }
          }
